<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water Tile Designer</title>
<style>
  :root { --bg:#12151c; --panel:#1b2028; --ink:#d8dee9; --dim:#7b8494; --accent:#58c4dd; --warn:#e8a04c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI",system-ui,sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; font-weight:600; }
  h1 span { color:var(--dim); font-weight:400; }
  #layout { display:flex; gap:16px; flex-wrap:wrap; }
  #controls { display:flex; flex-direction:column; gap:14px; background:var(--panel); border-radius:8px; padding:14px 16px; width:340px; }
  .group > b { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); display:block; margin-bottom:6px; }
  .ctl { display:grid; grid-template-columns:110px 130px 52px; align-items:center; gap:8px; margin-bottom:4px; }
  .ctl label { font-size:13px; }
  .ctl output { font-variant-numeric:tabular-nums; font-size:13px; color:var(--accent); text-align:right; }
  input[type=range] { width:130px; accent-color:var(--accent); }
  input[type=color] { width:40px; height:24px; border:none; background:none; padding:0; }
  input[type=number] { width:70px; background:#12151c; border:1px solid #3d4658; color:var(--ink); border-radius:4px; padding:3px 6px; }
  select { background:#12151c; border:1px solid #3d4658; color:var(--ink); border-radius:4px; padding:3px 6px; }
  .check { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .pal { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .pal label { font-size:13px; width:100px; }
  button { background:#2a3140; color:var(--ink); border:1px solid #3d4658; border-radius:6px; padding:6px 14px; font:13px "Segoe UI",system-ui,sans-serif; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #stats { font-size:12px; color:var(--dim); }
  #stats b.bad { color:var(--warn); }
  #view { background:var(--panel); border-radius:8px; padding:14px; }
  #view h2 { font-size:13px; margin:0 0 8px; color:var(--dim); font-weight:400; }
  canvas { image-rendering:pixelated; border-radius:4px; display:block; }
</style>
</head>
<body>

<h1>Water Tile Designer <span>&mdash; Wind Waker-style lattice + rotating deep-water stripes, for the Mode 7 sea</span></h1>

<div id="layout">
  <div id="controls">
    <div class="group"><b>Noise</b>
      <div class="ctl"><label>Pattern size</label>
        <select id="size"><option>64</option><option selected>128</option></select><output></output></div>
      <div class="ctl"><label>Seed</label><input type="number" id="seed" value="7"><button id="dice" style="padding:2px 8px">🎲</button></div>
      <div class="ctl"><label>Cells</label><input type="range" id="cells" min="2" max="12" step="1" value="5"><output for="cells"></output></div>
      <div class="ctl"><label>Surf octaves</label><input type="range" id="oct" min="1" max="4" step="1" value="2"><output for="oct"></output></div>
      <div class="ctl"><label>Surf persist</label><input type="range" id="pers" min="0.3" max="0.8" step="0.05" value="0.5"><output for="pers"></output></div>
      <div class="ctl"><label>Deep octaves</label><input type="range" id="octD" min="1" max="4" step="1" value="2"><output for="octD"></output></div>
      <div class="ctl"><label>Deep persist</label><input type="range" id="persD" min="0.3" max="0.8" step="0.05" value="0.5"><output for="persD"></output></div>
    </div>
    <div class="group"><b>Layers</b>
      <div class="ctl"><label>Lattice centre</label><input type="range" id="lc" min="-0.5" max="0.5" step="0.01" value="0"><output for="lc"></output></div>
      <div class="ctl"><label>Lattice width</label><input type="range" id="lw" min="0.02" max="0.5" step="0.01" value="0.14"><output for="lw"></output></div>
      <div class="check"><input type="checkbox" id="sepPeaks"><label for="sepPeaks">Separate colour for noise peaks</label></div>
    </div>
    <div class="group"><b>Deep stripes (palette rotation)</b>
      <div class="ctl"><label>Repeat X</label><input type="range" id="kx" min="-8" max="8" step="1" value="2"><output for="kx"></output></div>
      <div class="ctl"><label>Repeat Y</label><input type="range" id="ky" min="0" max="8" step="1" value="4"><output for="ky"></output></div>
      <div class="ctl"><label>Warp</label><input type="range" id="warp" min="0" max="2" step="0.1" value="0.8"><output for="warp"></output></div>
      <div class="ctl"><label>Slots</label>
        <select id="slots"><option selected>3</option><option>4</option></select><output></output></div>
      <div class="ctl"><label>Frames/step</label><input type="range" id="rotFrames" min="2" max="16" step="1" value="8"><output for="rotFrames"></output></div>
      <div class="check"><input type="checkbox" id="animate" checked><label for="animate">Animate rotation</label></div>
    </div>
    <div class="group"><b>Palette</b>
      <div class="pal"><label>Lattice</label><input type="color" id="cLat" value="#eaf7f0"></div>
      <div class="pal"><label>Peaks</label><input type="color" id="cPeak" value="#66b4e4"></div>
      <div class="pal"><label>Deep from</label><input type="color" id="cDeepA" value="#16407e"></div>
      <div class="pal"><label>Deep to</label><input type="color" id="cDeepB" value="#2e66b4"></div>
    </div>
    <div class="group"><b>Export</b>
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button id="exportPng">sea_pattern.png</button>
        <button id="exportJson">water_params.json</button>
      </div>
      <div id="stats"></div>
      <div style="font-size:11px;color:var(--dim);margin-top:6px">
        Save both into <code>assets/</code> &mdash; the bake script picks them up automatically.
      </div>
    </div>
  </div>

  <div id="view">
    <h2>Preview &mdash; tiled 2&times;2 so seams would show</h2>
    <canvas id="cv" width="512" height="512"></canvas>
  </div>
</div>

<script>
"use strict";

// ---- state ---------------------------------------------------------------
const S = {};
const ids = ["cells","oct","pers","octD","persD","lc","lw","kx","ky","warp","rotFrames"];
for (const id of ids) {
  const el = document.getElementById(id);
  const out = el.parentElement.querySelector("output");
  const sync = () => { S[id] = parseFloat(el.value); if (out) out.value = el.value; };
  el.addEventListener("input", () => { sync(); rebuild(); });
  sync();
}
for (const id of ["size","slots","seed","sepPeaks","cLat","cPeak","cDeepA","cDeepB"]) {
  document.getElementById(id).addEventListener("input", rebuild);
}
document.getElementById("dice").addEventListener("click", () => {
  document.getElementById("seed").value = Math.floor(Math.random() * 100000);
  rebuild();
});

// ---- tileable perlin -------------------------------------------------------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let perm = [];
function reseed(seed) {
  const rnd = mulberry32(seed);
  perm = Array.from({length: 256}, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  perm = perm.concat(perm);
}

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

function gradDot(hash, dx, dy) {
  const a = (hash & 15) / 16 * Math.PI * 2;
  return Math.cos(a) * dx + Math.sin(a) * dy;
}

// perlin on a wrapped lattice of `cells` x `cells`
function perlin(u, v, cells) {
  const x = u * cells, y = v * cells;
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const dx = x - x0, dy = y - y0;
  const xi = ((x0 % cells) + cells) % cells;
  const yi = ((y0 % cells) + cells) % cells;
  const xj = (xi + 1) % cells, yj = (yi + 1) % cells;
  const n00 = gradDot(perm[perm[xi] + yi], dx, dy);
  const n10 = gradDot(perm[perm[xj] + yi], dx - 1, dy);
  const n01 = gradDot(perm[perm[xi] + yj], dx, dy - 1);
  const n11 = gradDot(perm[perm[xj] + yj], dx - 1, dy - 1);
  const fx = fade(dx), fy = fade(dy);
  return (n00 + fx * (n10 - n00)) + fy * ((n01 + fx * (n11 - n01)) - (n00 + fx * (n10 - n00)));
}

function fbm(u, v, octaves, persistence) {
  let sum = 0, amp = 1, norm = 0, cells = S.cells;
  for (let o = 0; o < octaves; o++) {
    sum += amp * perlin(u, v, cells);
    norm += amp;
    amp *= persistence;
    cells *= 2;
  }
  return sum / norm * 1.4; // roughly [-1, 1]
}

// surface field: defines the lattice + peaks
function surfaceAt(u, v) { return fbm(u, v, S.oct, S.pers); }
// deep field: warps the stripes; offset so it decorrelates from the surface
// (any constant offset keeps the wrap seamless)
function deepAt(u, v) { return fbm(u + 0.43, v + 0.19, S.octD, S.persD); }

// ---- pattern build ---------------------------------------------------------
// palette indices: 0 sky (reserved), 1..slots deep stripes, slots+1 peaks, slots+2 lattice
let pattern = null;   // Uint8Array size*size
let size = 128;
let slots = 3;

function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerp3(a, b, t) { return [0,1,2].map(i => Math.round(a[i] + (b[i]-a[i]) * t)); }

function buildPalette() {
  const pal = Array.from({length: 256}, () => [0,0,0]);
  pal[0] = [248,168,96]; // sky, unused by the art
  const A = hex2rgb(document.getElementById("cDeepA").value);
  const B = hex2rgb(document.getElementById("cDeepB").value);
  for (let i = 0; i < slots; i++) pal[1+i] = lerp3(A, B, slots === 1 ? 0 : i/(slots-1));
  pal[slots+1] = hex2rgb(document.getElementById("cPeak").value);
  pal[slots+2] = hex2rgb(document.getElementById("cLat").value);
  return pal;
}

function rebuild() {
  size = parseInt(document.getElementById("size").value, 10);
  slots = parseInt(document.getElementById("slots").value, 10);
  reseed(parseInt(document.getElementById("seed").value, 10) | 0);
  const sep = document.getElementById("sepPeaks").checked;
  const tau = Math.PI * 2;

  pattern = new Uint8Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const n = surfaceAt(u, v);
      let idx;
      if (Math.abs(n - S.lc) < S.lw) {
        idx = slots + 2;                       // off-white lattice
      } else if (sep && n >= S.lc + S.lw) {
        idx = slots + 1;                       // peak islands
      } else {
        // deep stripes: integer repeats => tileable by construction,
        // warped by the independent deep-layer noise field
        const s = Math.sin(tau * (S.kx * u + S.ky * v) + S.warp * deepAt(u, v) * tau);
        let slot = Math.floor((s + 1) / 2 * slots);
        if (slot >= slots) slot = slots - 1;
        idx = 1 + slot;
      }
      pattern[y * size + x] = idx;
    }
  }
  updateStats();
  render();
}

// ---- preview ----------------------------------------------------------------
const cv = document.getElementById("cv");
const cctx = cv.getContext("2d");
let rotOfs = 0;

function displayIndex(idx) {
  if (idx >= 1 && idx <= slots) return 1 + ((idx - 1 + rotOfs) % slots);
  return idx;
}

function render() {
  const pal = buildPalette();
  const img = cctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const c = pal[displayIndex(pattern[i])];
    img.data[i*4] = c[0]; img.data[i*4+1] = c[1]; img.data[i*4+2] = c[2]; img.data[i*4+3] = 255;
  }
  const off = new OffscreenCanvas(size, size);
  off.getContext("2d").putImageData(img, 0, 0);
  cctx.imageSmoothingEnabled = false;
  const half = 256;
  for (let ty = 0; ty < 2; ty++)
    for (let tx = 0; tx < 2; tx++)
      cctx.drawImage(off, tx * half, ty * half, half, half);
}

function updateStats() {
  const tilesAcross = size / 8;
  const seen = new Set();
  for (let ty = 0; ty < tilesAcross; ty++) {
    for (let tx = 0; tx < tilesAcross; tx++) {
      let key = "";
      for (let py = 0; py < 8; py++)
        for (let px = 0; px < 8; px++)
          key += String.fromCharCode(pattern[(ty*8+py)*size + tx*8+px]);
      seen.add(key);
    }
  }
  const n = seen.size;
  const colours = slots + 3;
  document.getElementById("stats").innerHTML =
    "unique 8&times;8 tiles: <b" + (n > 256 ? ' class="bad"' : "") + ">" + n +
    "</b> / 256 &nbsp;&middot;&nbsp; colours: <b>" + colours + "</b> / 128 (sprite-safe)";
}

// rotation animation at 60fps cadence
let frame = 0;
function tick() {
  if (document.getElementById("animate").checked && pattern) {
    frame++;
    const nf = Math.max(2, S.rotFrames);
    const newOfs = Math.floor(frame / nf) % slots;
    if (newOfs !== rotOfs) { rotOfs = newOfs; render(); }
  }
  requestAnimationFrame(tick);
}

// ---- export -------------------------------------------------------------------
function crc32(buf) {
  let c, table = crc32.table;
  if (!table) {
    table = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
  }
  c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = table[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function adler32(buf) {
  let a = 1, b = 0;
  for (let i = 0; i < buf.length; i++) { a = (a + buf[i]) % 65521; b = (b + a) % 65521; }
  return ((b << 16) | a) >>> 0;
}

function zlibStored(data) {
  const out = [0x78, 0x01];
  for (let pos = 0; pos < data.length; pos += 65535) {
    const block = data.subarray(pos, Math.min(pos + 65535, data.length));
    const last = pos + 65535 >= data.length ? 1 : 0;
    out.push(last, block.length & 255, block.length >> 8,
             (~block.length) & 255, ((~block.length) >> 8) & 255);
    for (let i = 0; i < block.length; i++) out.push(block[i]);
  }
  const ad = adler32(data);
  out.push((ad >>> 24) & 255, (ad >>> 16) & 255, (ad >>> 8) & 255, ad & 255);
  return Uint8Array.from(out);
}

function pngChunk(tag, data) {
  const out = new Uint8Array(12 + data.length);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, data.length);
  for (let i = 0; i < 4; i++) out[4 + i] = tag.charCodeAt(i);
  out.set(data, 8);
  const crcBuf = out.subarray(4, 8 + data.length);
  dv.setUint32(8 + data.length, crc32(crcBuf));
  return out;
}

function download(name, bytes, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: mime }));
  a.download = name;
  a.click();
}

document.getElementById("exportPng").addEventListener("click", () => {
  const pal = buildPalette();
  const ihdr = new Uint8Array(13);
  const dv = new DataView(ihdr.buffer);
  dv.setUint32(0, size); dv.setUint32(4, size);
  ihdr[8] = 8; ihdr[9] = 3; // 8-bit indexed
  const plte = new Uint8Array(768);
  for (let i = 0; i < 256; i++) plte.set(pal[i], i * 3);
  const raw = new Uint8Array(size * (size + 1));
  for (let y = 0; y < size; y++) {
    raw[y * (size + 1)] = 0; // filter none
    raw.set(pattern.subarray(y * size, (y + 1) * size), y * (size + 1) + 1);
  }
  const sig = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];
  const parts = [Uint8Array.from(sig), pngChunk("IHDR", ihdr), pngChunk("PLTE", plte),
                 pngChunk("IDAT", zlibStored(raw)), pngChunk("IEND", new Uint8Array(0))];
  const total = parts.reduce((s, p) => s + p.length, 0);
  const png = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { png.set(p, o); o += p.length; }
  download("sea_pattern.png", png, "image/png");
});

document.getElementById("exportJson").addEventListener("click", () => {
  const json = JSON.stringify({
    rotStart: 1,
    rotCount: slots,
    rotFrames: Math.round(S.rotFrames)
  }, null, 2) + "\n";
  download("water_params.json", json, "application/json");
});

// ---- go -----------------------------------------------------------------------
rebuild();
requestAnimationFrame(tick);
</script>
</body>
</html>
