name: build-rom

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PVSnesLib
        run: |
          curl -sSL -o /tmp/pvsneslib.zip https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip
          unzip -q /tmp/pvsneslib.zip -d "$HOME"
          chmod +x "$HOME"/pvsneslib/devkitsnes/bin/* "$HOME"/pvsneslib/devkitsnes/tools/*

      - name: Build ROM
        run: |
          export PVSNESLIB_HOME="$HOME/pvsneslib"
          make -C game

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: superwaverace
          path: game/superwaverace.sfc

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ROM into site
        uses: actions/download-artifact@v4
        with:
          name: superwaverace
          path: web/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/

      - name: Show deployed URL
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Deployed: $URL"
          {
            echo "## 🌊 Web player deployed"
            echo ""
            echo "**Play it here:** $URL"
            echo ""
            echo "ROM: \`superwaverace.sfc\` built from \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
