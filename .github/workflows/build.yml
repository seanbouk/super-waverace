name: build-rom

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PVSnesLib
        run: |
          curl -sSL -o /tmp/pvsneslib.zip https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip
          unzip -q /tmp/pvsneslib.zip -d "$HOME"
          chmod +x "$HOME"/pvsneslib/devkitsnes/bin/* "$HOME"/pvsneslib/devkitsnes/tools/*

      - name: Build ROM
        run: |
          export PVSNESLIB_HOME="$HOME/pvsneslib"
          make -C game

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: superwaverace
          path: game/superwaverace.sfc

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download ROM into site
        uses: actions/download-artifact@v4
        with:
          name: superwaverace
          path: web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
